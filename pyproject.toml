[dependency-groups]
dev = [
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "ty==0.0.65",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["tools/cccc"]

[tool.ty.src]
include = ["scripts", "tests", "tools"]
