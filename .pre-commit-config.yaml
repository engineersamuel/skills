repos:
  - repo: local
    hooks:
      - id: validate-repository
        name: Validate repository contracts
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: python3 -m ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: Ruff format check
        entry: python3 -m ruff format --check .
        language: system
        pass_filenames: false
      - id: ty-check
        name: ty type check
        entry: ty check
        language: system
        pass_filenames: false
      - id: pytest
        name: Pytest
        entry: python3 -m pytest
        language: system
        pass_filenames: false
