name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate skill
        run: python3 scripts/validate.py

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0" >&2
            exit 1
          fi

  validate-canvas:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned Bun
        run: npm install --global bun@1.4.2

      - name: Build reviewed Nono
        shell: bash
        run: |
          git init "${RUNNER_TEMP}/nono"
          git -C "${RUNNER_TEMP}/nono" remote add origin \
            https://github.com/nolabs-ai/nono.git
          git -C "${RUNNER_TEMP}/nono" fetch --depth 1 origin \
            e1f84a33bdfecad82490285ea65058fdabe2028a
          git -C "${RUNNER_TEMP}/nono" checkout --detach FETCH_HEAD
          cargo build --release -p nono-cli --bin nono \
            --manifest-path "${RUNNER_TEMP}/nono/Cargo.toml"
          mkdir -p "${HOME}/.local/bin"
          install -m 0555 \
            "${RUNNER_TEMP}/nono/target/release/nono" \
            "${HOME}/.local/bin/nono"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install canvas dependencies
        working-directory: tools/canvas
        run: bun install --frozen-lockfile

      - name: Pin reviewed Nono
        working-directory: tools/canvas
        run: |
          bun scripts/pin-nono.ts \
            "${RUNNER_TEMP}/nono" \
            "${HOME}/.local/bin/nono"

      - name: Prepare sandbox runtime
        working-directory: tools/canvas
        run: bun run runtime:package

      - name: Probe prepared sandbox runtime
        working-directory: tools/canvas
        shell: bash
        run: |
          runtime="${PWD}/generated/runtime-darwin-arm64"
          report="$(
            CANVAS_NONO_BIN="${runtime}/nono" \
            CANVAS_BUN_BIN="${runtime}/bun" \
            CANVAS_RUNTIME_ROOT="${runtime}" \
            bun scripts/probe-sandbox.ts
          )"
          printf '%s\n' "${report}"
          grep -q '"status":"sandbox_ready"' <<<"${report}"

      - name: Verify canvas
        working-directory: tools/canvas
        run: bun run verify

  release:
    needs: [validate, validate-canvas]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned Bun
        run: npm install --global bun@1.4.2

      - name: Build reviewed Nono
        shell: bash
        run: |
          git init "${RUNNER_TEMP}/nono"
          git -C "${RUNNER_TEMP}/nono" remote add origin \
            https://github.com/nolabs-ai/nono.git
          git -C "${RUNNER_TEMP}/nono" fetch --depth 1 origin \
            e1f84a33bdfecad82490285ea65058fdabe2028a
          git -C "${RUNNER_TEMP}/nono" checkout --detach FETCH_HEAD
          cargo build --release -p nono-cli --bin nono \
            --manifest-path "${RUNNER_TEMP}/nono/Cargo.toml"
          mkdir -p "${HOME}/.local/bin"
          install -m 0555 \
            "${RUNNER_TEMP}/nono/target/release/nono" \
            "${HOME}/.local/bin/nono"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Prepare canvas release runtime
        working-directory: tools/canvas
        run: |
          bun install --frozen-lockfile
          bun scripts/pin-nono.ts \
            "${RUNNER_TEMP}/nono" \
            "${HOME}/.local/bin/nono"
          bun run runtime:package

      - name: Package skills
        shell: bash
        run: |
          mkdir -p dist/staging/justify
          cp -R skills/justify/. dist/staging/justify/
          cp README.md LICENSE dist/staging/justify/
          tar -C dist/staging -czf "dist/justify-${GITHUB_REF_NAME}.tar.gz" justify
          (cd dist/staging && zip -qr "../justify-${GITHUB_REF_NAME}.zip" justify)

          mkdir -p dist/staging/runwisp-job-authoring
          cp -R skills/runwisp-job-authoring/. dist/staging/runwisp-job-authoring/
          cp README.md LICENSE dist/staging/runwisp-job-authoring/
          tar -C dist/staging -czf \
            "dist/runwisp-job-authoring-${GITHUB_REF_NAME}.tar.gz" \
            runwisp-job-authoring
          (cd dist/staging && zip -qr \
            "../runwisp-job-authoring-${GITHUB_REF_NAME}.zip" \
            runwisp-job-authoring)

          mkdir -p dist/staging/goal-me
          cp -R skills/goal-me/. dist/staging/goal-me/
          cp README.md LICENSE dist/staging/goal-me/
          tar -C dist/staging -czf "dist/goal-me-${GITHUB_REF_NAME}.tar.gz" goal-me
          (cd dist/staging && zip -qr "../goal-me-${GITHUB_REF_NAME}.zip" goal-me)

          mkdir -p dist/staging/herdr-canvas
          cp -R skills/herdr-canvas/. dist/staging/herdr-canvas/
          cp README.md LICENSE dist/staging/herdr-canvas/
          tar -C dist/staging -czf \
            "dist/herdr-canvas-${GITHUB_REF_NAME}.tar.gz" \
            herdr-canvas
          (cd dist/staging && zip -qr \
            "../herdr-canvas-${GITHUB_REF_NAME}.zip" \
            herdr-canvas)

          mkdir -p dist/staging/herdr-canvas-integration/tools
          mkdir -p dist/staging/herdr-canvas-integration/skills
          cp -R tools/canvas dist/staging/herdr-canvas-integration/tools/
          cp -R skills/herdr-canvas \
            dist/staging/herdr-canvas-integration/skills/
          rm -rf \
            dist/staging/herdr-canvas-integration/tools/canvas/node_modules \
            dist/staging/herdr-canvas-integration/tools/canvas/.canvas \
            dist/staging/herdr-canvas-integration/tools/canvas/dist
          cp README.md LICENSE .mise.toml dist/staging/herdr-canvas-integration/
          tar -C dist/staging -czf \
            "dist/herdr-canvas-integration-${GITHUB_REF_NAME}.tar.gz" \
            herdr-canvas-integration
          (cd dist/staging && zip -qr \
            "../herdr-canvas-integration-${GITHUB_REF_NAME}.zip" \
            herdr-canvas-integration)

          mkdir -p dist/staging/finish
          cp -R skills/finish/. dist/staging/finish/
          cp README.md LICENSE dist/staging/finish/
          tar -C dist/staging -czf "dist/finish-${GITHUB_REF_NAME}.tar.gz" finish
          (cd dist/staging && zip -qr "../finish-${GITHUB_REF_NAME}.zip" finish)

          mkdir -p dist/staging/audit-ro
          cp -R skills/audit-ro/. dist/staging/audit-ro/
          cp README.md LICENSE dist/staging/audit-ro/
          tar -C dist/staging -czf "dist/audit-ro-${GITHUB_REF_NAME}.tar.gz" audit-ro
          (cd dist/staging && zip -qr "../audit-ro-${GITHUB_REF_NAME}.zip" audit-ro)

          mkdir -p dist/staging/clean-tests
          cp -R skills/clean-tests/. dist/staging/clean-tests/
          cp LICENSE dist/staging/clean-tests/
          tar -C dist/staging -czf \
            "dist/clean-tests-${GITHUB_REF_NAME}.tar.gz" \
            clean-tests
          (cd dist/staging && zip -qr \
            "../clean-tests-${GITHUB_REF_NAME}.zip" \
            clean-tests)

          mkdir -p dist/staging/ui-guidelines
          cp -R skills/ui-guidelines/. dist/staging/ui-guidelines/
          cp LICENSE dist/staging/ui-guidelines/
          tar -C dist/staging -czf \
            "dist/ui-guidelines-${GITHUB_REF_NAME}.tar.gz" \
            ui-guidelines
          (cd dist/staging && zip -qr \
            "../ui-guidelines-${GITHUB_REF_NAME}.zip" \
            ui-guidelines)

          mkdir -p dist/staging/trellage-guide
          cp -R skills/trellage-guide/. dist/staging/trellage-guide/
          cp README.md LICENSE dist/staging/trellage-guide/
          tar -C dist/staging -czf \
            "dist/trellage-guide-${GITHUB_REF_NAME}.tar.gz" \
            trellage-guide
          (cd dist/staging && zip -qr \
            "../trellage-guide-${GITHUB_REF_NAME}.zip" \
            trellage-guide)

          chmod -R u+w dist/staging
          rm -rf dist/staging
          (cd dist && shasum -a 256 \
            justify-"${GITHUB_REF_NAME}".tar.gz \
            justify-"${GITHUB_REF_NAME}".zip \
            runwisp-job-authoring-"${GITHUB_REF_NAME}".tar.gz \
            runwisp-job-authoring-"${GITHUB_REF_NAME}".zip \
            goal-me-"${GITHUB_REF_NAME}".tar.gz \
            goal-me-"${GITHUB_REF_NAME}".zip \
            herdr-canvas-"${GITHUB_REF_NAME}".tar.gz \
            herdr-canvas-"${GITHUB_REF_NAME}".zip \
            herdr-canvas-integration-"${GITHUB_REF_NAME}".tar.gz \
            herdr-canvas-integration-"${GITHUB_REF_NAME}".zip \
            finish-"${GITHUB_REF_NAME}".tar.gz \
            finish-"${GITHUB_REF_NAME}".zip \
            audit-ro-"${GITHUB_REF_NAME}".tar.gz \
            audit-ro-"${GITHUB_REF_NAME}".zip \
            clean-tests-"${GITHUB_REF_NAME}".tar.gz \
            clean-tests-"${GITHUB_REF_NAME}".zip \
            ui-guidelines-"${GITHUB_REF_NAME}".tar.gz \
            ui-guidelines-"${GITHUB_REF_NAME}".zip \
            trellage-guide-"${GITHUB_REF_NAME}".tar.gz \
            trellage-guide-"${GITHUB_REF_NAME}".zip \
            > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/justify-"${GITHUB_REF_NAME}".tar.gz \
            dist/justify-"${GITHUB_REF_NAME}".zip \
            dist/runwisp-job-authoring-"${GITHUB_REF_NAME}".tar.gz \
            dist/runwisp-job-authoring-"${GITHUB_REF_NAME}".zip \
            dist/goal-me-"${GITHUB_REF_NAME}".tar.gz \
            dist/goal-me-"${GITHUB_REF_NAME}".zip \
            dist/herdr-canvas-"${GITHUB_REF_NAME}".tar.gz \
            dist/herdr-canvas-"${GITHUB_REF_NAME}".zip \
            dist/herdr-canvas-integration-"${GITHUB_REF_NAME}".tar.gz \
            dist/herdr-canvas-integration-"${GITHUB_REF_NAME}".zip \
            dist/finish-"${GITHUB_REF_NAME}".tar.gz \
            dist/finish-"${GITHUB_REF_NAME}".zip \
            dist/audit-ro-"${GITHUB_REF_NAME}".tar.gz \
            dist/audit-ro-"${GITHUB_REF_NAME}".zip \
            dist/clean-tests-"${GITHUB_REF_NAME}".tar.gz \
            dist/clean-tests-"${GITHUB_REF_NAME}".zip \
            dist/ui-guidelines-"${GITHUB_REF_NAME}".tar.gz \
            dist/ui-guidelines-"${GITHUB_REF_NAME}".zip \
            dist/trellage-guide-"${GITHUB_REF_NAME}".tar.gz \
            dist/trellage-guide-"${GITHUB_REF_NAME}".zip \
            dist/SHA256SUMS \
            --generate-notes \
            --title "Agent Skills ${GITHUB_REF_NAME}" \
            --verify-tag
