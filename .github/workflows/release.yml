name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate skill
        run: python3 scripts/validate.py

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0" >&2
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Package skill
        shell: bash
        run: |
          archive="justify-${GITHUB_REF_NAME}"
          mkdir -p dist/staging/justify
          cp -R skills/justify/. dist/staging/justify/
          cp README.md LICENSE dist/staging/justify/
          tar -C dist/staging -czf "dist/${archive}.tar.gz" justify
          (cd dist/staging && zip -qr "../${archive}.zip" justify)
          rm -rf dist/staging
          (cd dist && sha256sum "${archive}.tar.gz" "${archive}.zip" > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/justify-"${GITHUB_REF_NAME}".tar.gz \
            dist/justify-"${GITHUB_REF_NAME}".zip \
            dist/SHA256SUMS \
            --generate-notes \
            --title "justify ${GITHUB_REF_NAME}" \
            --verify-tag
